spring.application.name=TFG

# Puerto: Railway lo asigna con la variable PORT
server.port=${PORT:8080}

# Base de datos MySQL: se configura con variables de entorno (Railway las rellena)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:tfg}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.mvc.view.prefix=/static/
spring.mvc.view.suffix=.html

# Contraseña de acceso a la app (obligatoria, se define en la variable LOGIN_PASSWORD)
login.password=${LOGIN_PASSWORD}
